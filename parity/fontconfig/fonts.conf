<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic fontconfig for the parity harness. Chromium is launched with FONTCONFIG_FILE pointing here, so the
  ONLY system fonts it can see are the ones vendored in parity/fonts (the designs bundle Manrope and Bricolage Grotesque
  as data: URIs; everything else, such as the warning/star/arrow/check glyphs, resolves through this set on every host).
  Nothing from /etc/fonts is included on purpose.
-->
<fontconfig>
  <dir prefix="relative">../fonts</dir>
  <cachedir prefix="relative">../../parity-reports/.fontcache</cachedir>

  <!-- Rendering: grayscale antialiasing, no hinting, no subpixel positioning surprises. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Generic families and system-ui all resolve to the same ordered list. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
