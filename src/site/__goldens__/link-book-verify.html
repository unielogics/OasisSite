<div style="position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;animation:oaIn .3s cubic-bezier(.2,.8,.2,1)">
  <div style="position:sticky;top:0;z-index:5;flex:none;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line2)">
    <div style="height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px">
      <div>
        <button aria-label="Back" style="width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
      <img src="/assets/oasis-logo.png" alt="Oasis Auto Spa" style="height:64px;width:auto">
      <div style="display:flex;justify-content:flex-end">
        <button aria-label="Close" style="width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
    </div>
    <div style="height:3px;background:var(--line2)">
      <div style="height:100%;width:95%;background:#1FB6FF;box-shadow:0 0 12px rgba(31,182,255,.8);transition:width .5s cubic-bezier(.2,.8,.2,1)"></div>
    </div>
  </div>
  <div style="flex:1;max-width:1080px;width:100%;margin:0 auto;padding:30px 20px 150px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:30px;align-items:start">
    <div style="min-width:0;display:flex;flex-direction:column;gap:14px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--accentText)">
          <span class="sc-interp">
            BOOKING FOR MARIA ••51
          </span>
        </div>
        <h1 style="margin:12px 0 8px;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(32px,8.5vw,64px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent">
          <span class="sc-interp">
            Confirm it’s you
          </span>
        </h1>
      </div>
      <div style="padding:18px;border-radius:20px;background:var(--card);border:1.5px solid var(--cyanBrd)">
        <div style="font-weight:800;font-size:17px">
          <span class="sc-interp">
            Confirm it’s you
          </span>
        </div>
        <div style="font-size:13.5px;color:var(--ink3);margin-top:3px">
          <span class="sc-interp">
            We’ll text a 6-digit code to ••51.
          </span>
        </div>
        <button style="margin-top:12px;height:46px;padding:0 16px;border-radius:13px;background:#1FB6FF;color:#00131D;font-weight:800;font-size:14px">
          <span class="sc-interp">
            Text me a code
          </span>
        </button>
      </div>
      <div style="padding:14px 16px;border-radius:16px;background:var(--inset);font-size:13.5px;line-height:1.5;color:var(--ink2)">
        <span class="sc-interp">
          We only ask for your PIN or a code on this page, never by text.
        </span>
      </div>
    </div>
    <div style="position:sticky;top:100px;min-width:0">
      <div style="max-width:460px;margin:0 auto;padding:1.5px;border-radius:26px;background:linear-gradient(150deg,rgba(255,255,255,.6),rgba(124,136,147,.4) 30%,#1FB6FF 55%,rgba(233,238,242,.5) 80%,rgba(89,99,109,.6))">
        <div style="padding:20px;border-radius:24.5px;background:radial-gradient(90% 60% at 100% 0%,rgba(31,182,255,.2),transparent 60%),linear-gradient(180deg,#0E1419,#07090C);color:#F2F5F7">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#7FD6FF">
              YOUR BOOKING
            </span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#00131D;background:#1FB6FF;padding:3px 8px;border-radius:6px">
              <span class="sc-interp">
                GUEST
              </span>
            </span>
          </div>
          <div style="font-family:'Archivo',sans-serif;font-stretch:115%;font-weight:900;font-size:26px;letter-spacing:-.01em;margin-top:12px">
            <span class="sc-interp">
              Monday · 9:00 AM
            </span>
          </div>
          <div style="font-size:13.5px;color:#8C97A1;margin-top:3px">
            468 River Drive, Garfield
          </div>
          <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px">
            <div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px">
              <span style="color:#B7C0C8">
                <span class="sc-interp">
                  Vehicle
                </span>
              </span>
              <span style="font-weight:800;color:#F2F5F7">
                <span class="sc-interp">
                  Sedan / Coupe
                </span>
              </span>
            </div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px">
              <span style="color:#B7C0C8">
                <span class="sc-interp">
                  Signature Hand Wash
                </span>
              </span>
              <span style="font-weight:800;color:#F2F5F7">
                <span class="sc-interp">
                  from $40
                </span>
              </span>
            </div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px">
              <span style="color:#B7C0C8">
                <span class="sc-interp">
                  Booking fee
                </span>
              </span>
              <span style="font-weight:800;color:#FFB547">
                <span class="sc-interp">
                  $25
                </span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
