<div style="position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;animation:oaIn .3s cubic-bezier(.2,.8,.2,1)">
  <div style="position:sticky;top:0;z-index:5;flex:none;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line2)">
    <div style="height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px">
      <div></div>
      <img src="/assets/oasis-logo.png" alt="Oasis Auto Spa" style="height:64px;width:auto">
      <div style="display:flex;justify-content:flex-end">
        <button aria-label="Close" style="width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
    </div>
    <div style="height:3px;background:var(--line2)">
      <div style="height:100%;width:60%;background:#1FB6FF;box-shadow:0 0 12px rgba(31,182,255,.8);transition:width .5s cubic-bezier(.2,.8,.2,1)"></div>
    </div>
  </div>
  <div style="flex:1;max-width:1080px;width:100%;margin:0 auto;padding:30px 20px 150px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:30px;align-items:start">
    <div style="min-width:0;display:flex;flex-direction:column;gap:14px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--accentText)">
          <span class="sc-interp">
            VERIFY · MARIA ••51
          </span>
        </div>
        <h1 style="margin:12px 0 8px;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(32px,8.5vw,64px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent">
          <span class="sc-interp">
            Confirm it’s you
          </span>
        </h1>
      </div>
      <div style="padding:18px;border-radius:20px;background:var(--card);border:1.5px solid var(--cyanBrd)">
        <div style="font-weight:800;font-size:17px">
          <span class="sc-interp">
            Enter the code we texted
          </span>
        </div>
        <div style="font-size:13.5px;color:var(--ink3);margin-top:3px">
          <span class="sc-interp">
            Sent to ••51 · 6 digits, 3 tries
          </span>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <input inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" style="flex:1;min-width:0;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--inset);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600" value="">
          <button style="flex:none;height:52px;padding:0 18px;border-radius:14px;background:#1FB6FF;color:#00131D;font-weight:800;font-size:15px">
            <span class="sc-interp">
              Verify
            </span>
          </button>
        </div>
        <div style="font-size:12.5px;color:#E5533D;margin-top:8px;font-weight:700">
          <span class="sc-interp">
            That code didn’t match. 2 more tries before you need a new one.
          </span>
        </div>
        <div>
          <button style="margin-top:12px;font-size:13px;font-weight:700;color:var(--ink3)">
            <span class="sc-interp">
              Send a new code
            </span>
          </button>
        </div>
      </div>
      <div style="padding:14px 16px;border-radius:16px;background:var(--inset);font-size:13.5px;line-height:1.5;color:var(--ink2)">
        <span class="sc-interp">
          We only ask for your PIN or a code on this page, never by text.
        </span>
      </div>
    </div>
  </div>
</div>
